# docker/nginx.conf
# Configuración para SPA React/Vite con headers CORS especiales
# requeridos por el proyecto (Cross-Origin-Opener-Policy + Cross-Origin-Embedder-Policy)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------
    # Healthcheck endpoint (para Docker healthcheck)
    # -----------------------------------------------------------
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------
    # Headers requeridos por el proyecto
    # Estos mismos están en vite.config.ts — hay que replicarlos
    # en Nginx para que el build de producción funcione igual
    # -----------------------------------------------------------
    add_header Cross-Origin-Opener-Policy    "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy  "require-corp"   always;

    # Headers de seguridad adicionales
    add_header X-Frame-Options              "SAMEORIGIN"      always;
    add_header X-Content-Type-Options       "nosniff"         always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------
    # Assets estáticos — cache agresivo
    # Los ficheros de Vite tienen hash en el nombre → inmutables
    # -----------------------------------------------------------
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repetir headers CORS en esta location (Nginx no los hereda)
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # -----------------------------------------------------------
    # SPA fallback — todo redirige a index.html
    # React Router maneja el routing en cliente
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------
    # Compresión gzip
    # -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
