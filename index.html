  <body>
    <div id="root"></div>
    <script>
      // v5 - Force unregister all service workers and clear caches
      (function(){
        var VER = 'v5';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
            return caches.keys();
          }).then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            if (sessionStorage.getItem('sw_ver') !== VER) {
              sessionStorage.setItem('sw_ver', VER);
              location.reload();
            }
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
